[define]
# 注意：key 必须带引号。TOML 里裸写的 MACRO.VERSION = "..." 会被解析成嵌套表
# { MACRO = { VERSION = ... } }，Bun 的 define 拿不到字面 key "MACRO.VERSION"，
# 替换不会发生，运行时直接 ReferenceError: MACRO is not defined（已实测验证）。
"MACRO.VERSION" = "\"1.0.0-dev\""
"MACRO.PACKAGE_URL" = "\"claude-code-reconstructed\""
"MACRO.NATIVE_PACKAGE_URL" = "\"claude-code-reconstructed\""
"MACRO.BUILD_TIME" = "\"\""
"MACRO.FEEDBACK_CHANNEL" = "\"local\""
"MACRO.VERSION_CHANGELOG" = "\"\""
"MACRO.ISSUES_EXPLAINER" = "\"\""
